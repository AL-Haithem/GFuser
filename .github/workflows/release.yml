name: Publish Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          $packageVersion = node -p "require('./package.json').version"
          if ($tagVersion -ne $packageVersion) {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $packageVersion"
          }

      - run: npm ci
      - run: npm run check
      - name: Build and publish to releases repository
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RELEASES_REPO)) {
            throw 'RELEASES_REPO must be set to owner/repository.'
          }
          if ($env:RELEASES_REPO -notmatch '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$') {
            throw 'RELEASES_REPO must use the owner/repository format.'
          }
          if ([string]::IsNullOrWhiteSpace($env:RELEASES_TOKEN)) {
            throw 'RELEASES_TOKEN must be configured as a repository secret.'
          }

          $owner, $repository = $env:RELEASES_REPO.Split('/', 2)
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $config = $package.build
          $config | Add-Member -NotePropertyName publish -NotePropertyValue @{
            provider = 'github'
            owner = $owner
            repo = $repository
            releaseType = 'release'
          } -Force

          $configPath = Join-Path $env:RUNNER_TEMP 'release-builder-config.json'
          $config | ConvertTo-Json -Depth 100 | Set-Content -Path $configPath -Encoding utf8NoBOM
          $env:GH_TOKEN = $env:RELEASES_TOKEN
          npm run build:installer -- --publish always --config $configPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          RELEASES_REPO: ${{ secrets.RELEASES_REPO }}
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
