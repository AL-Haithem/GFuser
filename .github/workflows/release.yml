name: Build and Publish Windows Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build and publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw 'Release tag must use the vMAJOR.MINOR.PATCH format.'
          }
          $tagVersion = $env:RELEASE_TAG -replace '^v', ''
          $packageVersion = node -p "require('./package.json').version"
          if ($tagVersion -ne $packageVersion) {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $packageVersion"
          }

      - name: Check application
        run: npm run check

      - name: Build and publish release assets
        shell: pwsh
        env:
          RELEASES_REPO: ${{ secrets.RELEASES_REPO }}
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RELEASES_REPO) -or $env:RELEASES_REPO -notmatch '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$') {
            throw 'RELEASES_REPO must be configured as owner/repository.'
          }
          if ([string]::IsNullOrWhiteSpace($env:RELEASES_TOKEN)) {
            throw 'RELEASES_TOKEN must be configured as a repository secret.'
          }

          $owner, $repository = $env:RELEASES_REPO.Split('/', 2)
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $config = $package.build
          $config | Add-Member -NotePropertyName publish -NotePropertyValue @{
            provider = 'github'
            owner = $owner
            repo = $repository
            releaseType = 'release'
          } -Force

          $configPath = Join-Path $env:RUNNER_TEMP 'release-builder-config.json'
          $config | ConvertTo-Json -Depth 100 | Set-Content -Path $configPath -Encoding utf8NoBOM
          $env:GH_TOKEN = $env:RELEASES_TOKEN
          npm run build:installer -- --publish always --config $configPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
