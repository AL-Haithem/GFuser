name: Publish Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          $packageVersion = node -p "require('./package.json').version"
          if ($tagVersion -ne $packageVersion) {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $packageVersion"
          }

      - run: npm ci
      - run: npm run check
      - run: npm run build:installer -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}